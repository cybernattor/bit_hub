name: bit Hub Supabase Keep-Alive

on:
  schedule:
    # Запуск каждые 3 дня в 00:00 UTC
    - cron: '0 0 */3 * *'
  # Кнопка для ручного запуска
  workflow_dispatch:

jobs:
  ping-and-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Ping and Wakeup Supabase
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: "ktxnkbfhnsfdkchchsch"

        run: |
          echo "Checking bit Hub database status ($PROJECT_REF)..."

          # 1. Пингуем базу
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${PROJECT_REF}.supabase.co/rest/v1/" || true)
          echo "HTTP Status: $HTTP_STATUS"

          # 2. Если спит (503, 500 или нет ответа) — шлем Management API команду на подъем
          if [ "$HTTP_STATUS" -eq 503 ] || [ "$HTTP_STATUS" -eq 500 ] || [ "$HTTP_STATUS" -eq 000 ]; then
            echo "Database is sleeping! Sending RESTORE command..."

            RESTORE_RESP=$(curl -s -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json")

            echo "Management API response: $RESTORE_RESP"
          else
            echo "Database for bit Hub is active and healthy!"
          fi